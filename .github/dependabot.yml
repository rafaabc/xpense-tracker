version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    ignore:
      # esbuild/@esbuild-kit/* advisories under drizzle-kit only have a
      # semver-major *downgrade* fix (0.31.x -> 0.18.1). drizzle-kit is a
      # dev-only CLI (db:push/db:studio), never shipped or run against
      # untrusted input. Wait for an upstream fix instead of opening
      # unmergeable PRs every week.
      - dependency-name: 'drizzle-kit'
      # typescript-eslint does not support TS 7.0 yet (typescript-eslint#10940),
      # so eslint-config-next breaks on any TS major bump above 5.x. Minor/patch
      # for typescript still flow normally.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # eslint-plugin-react (bundled in eslint-config-next) calls the removed
      # context.getFilename() API on ESLint 10, breaking react/display-name.
      # Minor/patch for eslint still flow normally.
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
    groups:
      production-dependencies:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
      development-dependencies:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
      next-major:
        patterns:
          - 'next'
          - 'eslint-config-next'
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
        update-types:
          - 'major'
      test-tooling-major:
        patterns:
          - 'vitest'
          - '@vitest/coverage-v8'
          - '@playwright/test'
          - 'jsdom'
          # vitest 5 peer-requires @types/node ^22 || >=24; grouped here so
          # the two always bump together instead of splitting into an
          # unmergeable PR (see #29/#33).
          - '@types/node'
        update-types:
          - 'major'
      drizzle-major:
        patterns:
          - 'drizzle-orm'
          - 'drizzle-kit'
        update-types:
          - 'major'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      github-actions:
        patterns:
          - '*'
