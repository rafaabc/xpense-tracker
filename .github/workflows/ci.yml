name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly audit, so advisories disclosed during a quiet week still surface.
    - cron: '0 6 * * 1'

permissions:
  contents: read

# A new push to a PR cancels its superseded run. Every other run gets its own
# group, so runs on main are never cancelled (not even while pending).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # Detects docs-only changes. This is a job-level skip, NOT `paths-ignore`:
  # lint, test and e2e are required checks, and a workflow that never runs
  # leaves the PR unmergeable. A skipped job satisfies its required check.
  changes:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        name: Detect whether any non-docs file changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          DOCS_PATTERN='(^|/)[^/]+\.md$|^docs/|^LICENSE$'
          code=true
          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            if [ "$EVENT_NAME" = "pull_request" ]; then
              changed="$(git diff --name-only "$BASE_SHA"...HEAD)"
            else
              changed="$(git diff --name-only "$BASE_SHA" HEAD)"
            fi
            echo "$changed"
            if [ -n "$changed" ] && ! echo "$changed" | grep -qvE "$DOCS_PATTERN"; then
              code=false
            fi
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  # Not a required check yet.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Reads the lockfile only, so no `npm ci`. The retry covers transient
      # errors from the npm audit endpoint.
      - name: Audit production dependencies
        run: |
          for attempt in 1 2 3 4; do
            if npm audit --package-lock-only --omit=dev --audit-level=high; then
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              echo "Attempt $attempt failed, retrying in $((attempt * 15))s..."
              sleep $((attempt * 15))
            fi
          done
          exit 1

  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    needs: changes
    # `!= 'false'`: if `changes` itself fails, run the tests instead of
    # skipping them (a skipped required check would let the PR merge).
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # vitest run --coverage is unconditionally single-pass (no watch mode).
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore

  e2e:
    needs: [changes, lint, test]
    # Dependabot PRs run with Dependabot secrets, not Actions secrets, so
    # NEON_API_KEY etc. are empty and this job can never pass on them.
    # lint + test still gate dependency bumps; e2e runs on human PRs and main.
    if: >-
      ${{ !cancelled() &&
      needs.lint.result == 'success' &&
      needs.test.result == 'success' &&
      needs.changes.outputs.code != 'false' &&
      github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Auth secrets available to all steps; DATABASE_URL is injected via .env.local
    # after the Neon branch is created (see "Write .env.local" step).
    env:
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      AUTH_GOOGLE_ID: ${{ secrets.AUTH_GOOGLE_ID }}
      AUTH_GOOGLE_SECRET: ${{ secrets.AUTH_GOOGLE_SECRET }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # --- Ephemeral Neon branch -------------------------------------------
      # Each run gets a fresh copy-on-write clone of the parent branch.
      # The clone inherits the schema, so no db:push is needed.
      # Branch name is keyed on run_id + attempt to survive re-runs.
      - name: Create Neon branch
        id: neon
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          parent: ${{ secrets.NEON_PARENT_BRANCH }}
          branch_name: ci-${{ github.run_id }}-${{ github.run_attempt }}
          api_key: ${{ secrets.NEON_API_KEY }}

      # Reconstruct .env.local so dotenv-cli (used by `npm run dev` and
      # `npm run test:e2e`) can find it. DATABASE_URL comes from the fresh branch.
      - name: Write .env.local
        env:
          NEON_DB_URL: ${{ steps.neon.outputs.db_url }}
        run: |
          cat > .env.local <<EOF
          DATABASE_URL=${NEON_DB_URL}
          AUTH_SECRET=${AUTH_SECRET}
          AUTH_GOOGLE_ID=${AUTH_GOOGLE_ID}
          AUTH_GOOGLE_SECRET=${AUTH_GOOGLE_SECRET}
          CRON_SECRET=${CRON_SECRET}
          EOF

      # --- Playwright browser cache ----------------------------------------
      # Cache keyed on package-lock.json so a Playwright version bump busts it.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browser
        # OS deps are not cached; always install them. On a cache hit the
        # browser binaries are already present so this is fast.
        run: npx playwright install --with-deps chromium

      # playwright.config.ts uses webServer.url to poll http://localhost:3000
      # before tests start — no sleep step needed.
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      # --- Tear down the ephemeral branch ----------------------------------
      # Runs even if tests fail so no ci-* branches are left in the Neon console.
      - name: Delete Neon branch
        if: always()
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          branch: ci-${{ github.run_id }}-${{ github.run_attempt }}
          api_key: ${{ secrets.NEON_API_KEY }}
